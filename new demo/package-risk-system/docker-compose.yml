services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      MODEL_DIR: /app/models
      DATA_DIR: /app/scans
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./models:/app/models
      - ./scans:/app/scans
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      backend:
        condition: service_healthy
